org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g
# Roborazzi renders the screenshot tests on every test run (images under build/outputs/roborazzi, not committed), so
# drawing code is exercised and the images can be looked at in CI artifacts.
roborazzi.test.record=true
