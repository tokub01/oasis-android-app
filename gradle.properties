# Sized for a 16 GB Mac that also runs Docker and iOS simulators: one 2 GB daemon, four workers.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1536m
# Roborazzi renders the screenshot tests on every test run (images under build/outputs/roborazzi, not committed), so
# drawing code is exercised and the images can be looked at in CI artifacts.
roborazzi.test.record=true
