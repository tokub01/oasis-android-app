# Oasis rules on top of detekt's defaults (buildUponDefaultConfig): Compose-friendly naming and sizes.
config:
  validation: true

complexity:
  LongMethod:
    threshold: 120
    # Screens read top to bottom like the iOS views they mirror.
    ignoreAnnotated: ['Composable']
    excludes: ['**/test/**']
  LongParameterList:
    functionThreshold: 12
    constructorThreshold: 12
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    threshold: 25
    excludes: ['**/test/**']
    ignoreSimpleWhenEntries: true
  ComplexCondition:
    threshold: 6
  NestedBlockDepth:
    threshold: 6
  LargeClass:
    threshold: 800

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
  MatchingDeclarationName:
    active: false
  ConstructorParameterNaming:
    excludes: ['**/test/**']
  FunctionParameterNaming:
    excludes: ['**/test/**']
  VariableNaming:
    excludes: ['**/test/**']

style:
  MagicNumber:
    active: false
  MaxLineLength:
    # German UI texts stay on one line, as on iOS, so they can be found and compared.
    active: false
  WildcardImport:
    active: true
  ReturnCount:
    max: 6
    excludeGuardClauses: true
    excludes: ['**/test/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ForbiddenComment:
    active: false
  DestructuringDeclarationWithTooManyEntries:
    maxDestructuringEntries: 4
  UnnecessaryAbstractClass:
    active: false
  ThrowsCount:
    # The crypto checks fail with a distinct error per step, like OasisChatCrypto.
    max: 10
  LoopWithTooManyJumpStatements:
    maxJumpCount: 3
  UseCheckOrError:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  InstanceOfCheckForException:
    active: false
  SwallowedException:
    active: false
  TooGenericExceptionThrown:
    active: false

performance:
  SpreadOperator:
    active: false

potential-bugs:
  LateinitUsage:
    active: false
