# Oasis rules on top of detekt's defaults (buildUponDefaultConfig): Compose-friendly naming and sizes.
config:
  validation: true

complexity:
  LongMethod:
    threshold: 120
  LongParameterList:
    functionThreshold: 12
    constructorThreshold: 12
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    threshold: 25
    ignoreSimpleWhenEntries: true
  ComplexCondition:
    threshold: 6
  NestedBlockDepth:
    threshold: 6
  LargeClass:
    threshold: 800

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9]*'
  MatchingDeclarationName:
    active: false
  ConstructorParameterNaming:
    excludes: ['**/test/**']
  FunctionParameterNaming:
    excludes: ['**/test/**']
  VariableNaming:
    excludes: ['**/test/**']

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 160
    excludeCommentStatements: true
  WildcardImport:
    active: true
  ReturnCount:
    max: 6
    excludeGuardClauses: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ForbiddenComment:
    active: false
  DestructuringDeclarationWithTooManyEntries:
    maxDestructuringEntries: 4
  UnnecessaryAbstractClass:
    active: false
  ThrowsCount:
    max: 4
  LoopWithTooManyJumpStatements:
    maxJumpCount: 3
  UseCheckOrError:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
  TooGenericExceptionThrown:
    active: false

performance:
  SpreadOperator:
    active: false

potential-bugs:
  LateinitUsage:
    active: false
